<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>김민석 | About Me</title>
  <meta name="description" content="김민석을 소개하는 페이지입니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f3;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #2f6feb;
      --line: #e4e2dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e6e8eb;
        --muted: #9aa3ad;
        --accent: #6ea1ff;
        --line: #262b34;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 20px 48px;
    }
    header { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: grid; place-items: center;
      color: #fff; font-size: 36px; font-weight: 700;
      flex-shrink: 0;
    }
    h1 { margin: 0; font-size: 2rem; letter-spacing: -0.02em; }
    .tagline { margin: 4px 0 0; color: var(--muted); }
    section {
      margin-top: 40px;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    p { margin: 0; }
    ul { margin: 0; padding-left: 1.2em; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; }
    .tags li {
      padding: 4px 12px; border-radius: 999px;
      border: 1px solid var(--line); font-size: 0.9rem;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">민</div>
      <div>
        <h1>안녕하세요, 김민석입니다 👋</h1>
        <p class="tagline">새로운 도구로 만들고 배포하는 것을 좋아합니다.</p>
      </div>
    </header>

    <section>
      <h2>소개</h2>
      <p>
        GitHub, Supabase, Vercel로 개발 환경을 막 갖췄고, 이 페이지는 그 배포 흐름을 처음 시험해 보는 결과물입니다.
        앞으로 이곳에 만든 프로젝트와 배운 것들을 기록해 나갈 예정입니다.
      </p>
    </section>

    <section>
      <h2>사용하는 도구</h2>
      <ul class="tags">
        <li>GitHub</li>
        <li>Vercel</li>
        <li>Supabase</li>
        <li>Claude Code</li>
      </ul>
    </section>

    <section>
      <h2>연락처</h2>
      <ul>
        <li>Email: <a href="mailto:kms3429@gmail.com">kms3429@gmail.com</a></li>
      </ul>
    </section>

    <footer>© <span id="year"></span> 김민석 · Deployed on Vercel</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
